<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contribution List</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="festive-bg.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Mountains of Christmas", cursive;
            background-color: #1a0a0a;
            color: #fff;
            padding: 24px 16px 40px;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background: url('xmas.gif') center center / cover no-repeat;
            background-color: #0b1a2e;
        }

        .page {
            position: relative;
            z-index: 1;
            max-width: 560px;
            margin: 0 auto;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 14px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.45);
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .back-btn:hover {
            background: rgba(0, 0, 0, 0.65);
        }

        h1 {
            margin: 0 0 8px;
            font-family: "Mountains of Christmas", cursive;
            font-size: 2.6rem;
            text-align: center;
            background: linear-gradient(90deg, #ff6b6b, #e63946, #ff8fab, #c1121f, #ff6b6b);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.55));
            animation: headingShine 3.5s linear infinite;
        }

        @keyframes headingShine {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .subtitle {
            text-align: center;
            margin: 0 0 22px;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        }

        .list-panel {
            position: relative;
            background: rgba(0, 0, 0, 0.28);
            border: 1px solid rgba(255, 215, 120, 0.35);
            border-radius: 16px;
            padding: 18px 14px;
        }

        .item-tree {
            position: absolute;
            right: 10px;
            bottom: 8px;
            width: 52px;
            height: auto;
            pointer-events: none;
            image-rendering: pixelated;
        }

        .contribution-item {
            position: relative;
            overflow: hidden;
            padding: 14px 72px 14px 14px;
            margin-bottom: 12px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.75);
            background: linear-gradient(135deg, #fff7ea 0%, #ffd6e4 42%, #e7fff3 100%);
            background-size: 180% 180%;
            box-shadow: 0 8px 18px rgba(120, 30, 40, 0.18);
            animation: cardShift 7s ease-in-out infinite;
            transition: transform 0.22s ease, box-shadow 0.22s ease;
        }

        .contribution-item:nth-child(2n) {
            background: linear-gradient(135deg, #fff4f6 0%, #ffe7a8 48%, #e4f4ff 100%);
            background-size: 180% 180%;
            animation-delay: -2s;
        }

        .contribution-item:nth-child(3n) {
            animation-delay: -4s;
        }

        .contribution-item::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(110deg, transparent 32%, rgba(255, 255, 255, 0.55) 48%, transparent 64%);
            background-size: 220% 100%;
            animation: cardShine 4.2s ease-in-out infinite;
            pointer-events: none;
        }

        .contribution-item:hover {
            transform: translateY(-4px) scale(1.015);
            box-shadow: 0 14px 26px rgba(180, 40, 60, 0.28);
        }

        .contribution-item:active {
            transform: translateY(-1px) scale(1);
        }

        @keyframes cardShift {
            0%, 100% { background-position: 0% 40%; }
            50% { background-position: 100% 60%; }
        }

        @keyframes cardShine {
            0%, 100% { background-position: 120% 0; }
            50% { background-position: -20% 0; }
        }

        @media screen and (max-width: 700px) {
            body.is-scrolling .contribution-item {
                box-shadow: 0 0 18px rgba(255, 226, 140, 0.85), 0 8px 18px rgba(120, 30, 40, 0.2);
            }

            body.is-scrolling .contribution-item::before {
                animation: none;
                background: linear-gradient(105deg, transparent 28%, rgba(255, 255, 255, 0.2) 40%, rgba(255, 255, 255, 0.95) 50%, rgba(255, 244, 180, 0.85) 56%, transparent 70%);
                background-size: 220% 100%;
                background-position: var(--shine, 120%) 0;
            }
        }

        .contribution-item strong,
        .contribution-item span,
        .contribution-actions {
            position: relative;
            z-index: 1;
        }

        .item-tree {
            z-index: 1;
        }

        .contribution-item strong {
            color: #0d3b66;
            display: block;
            margin-bottom: 6px;
            font-size: 15px;
        }

        .contribution-item span {
            color: #1e4d6b;
            display: block;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .contribution-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .action-btn {
            padding: 4px 16px 6px;
            border-radius: 999px;
            border: 1px solid #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
            color: #fff;
            font-family: "Mountains of Christmas", cursive;
            font-size: 1.15rem;
            cursor: pointer;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
        }

        .action-btn:hover {
            filter: brightness(1.08);
        }

        .action-btn.delete-btn {
            background: linear-gradient(180deg, #ff6b6b 0%, #e63946 45%, #c1121f 100%);
            box-shadow: 0 2px 8px rgba(120, 0, 0, 0.3);
        }

        .action-btn.edit-btn {
            background: linear-gradient(180deg, #ffe066 0%, #f4c430 45%, #d4a017 100%);
            color: #5a3d00;
            text-shadow: 0 1px 1px rgba(255, 255, 255, 0.35);
            box-shadow: 0 2px 8px rgba(180, 140, 0, 0.35);
        }

        .action-btn.receipt-btn {
            background: linear-gradient(180deg, #6bff8f 0%, #28a745 45%, #1e7e34 100%);
            box-shadow: 0 2px 8px rgba(30, 100, 40, 0.35);
        }

        .no-receipt {
            align-self: center;
            font-size: 12px;
            color: #8a8a8a;
        }

        .receipt-viewer {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(0, 0, 0, 0.85);
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
        }

        .receipt-viewer.open {
            display: flex;
        }

        .receipt-viewer p {
            margin: 0 0 12px;
            font-weight: bold;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 1);
        }

        .receipt-viewer img {
            max-width: min(90vw, 480px);
            max-height: 72vh;
            border-radius: 8px;
            background: #fff;
        }

        .receipt-viewer .action-btn {
            margin-top: 14px;
        }

        .empty {
            text-align: center;
            color: #0d3b66;
            padding: 24px;
            background: linear-gradient(135deg, #fff7ea 0%, #ffd6e4 50%, #e7fff3 100%);
            border: 1px solid rgba(255, 255, 255, 0.75);
            border-radius: 16px;
            margin: 0;
        }

        .edit-panel {
            display: none;
            margin-bottom: 18px;
            padding: 18px 14px;
            background: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 16px;
        }

        .edit-panel h3 {
            margin: 0 0 12px;
            text-align: center;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 1);
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 8px;
            font-size: 16px;
            font-family: "Mountains of Christmas", cursive;
            background: #fff;
            color: #0d3b66;
        }

        .submit-btn {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        .cancel-btn {
            margin-top: 10px;
            background: #6c757d;
        }

        @media screen and (max-width: 700px) {
            body {
                overflow-x: hidden;
                padding: 16px 10px 28px;
            }

            .page {
                max-width: 100%;
            }

            h1 {
                font-size: 2.1rem;
            }

            .subtitle {
                font-size: 0.92rem;
                margin-bottom: 16px;
            }

            .list-panel {
                padding: 12px 10px;
            }

            .contribution-item {
                padding: 12px 52px 12px 12px;
                margin-bottom: 10px;
            }

            .contribution-item strong {
                font-size: 14px;
                padding-right: 4px;
                word-break: break-word;
            }

            .contribution-item span {
                font-size: 13px;
                word-break: break-word;
            }

            .contribution-actions {
                gap: 6px;
                max-width: calc(100% - 4px);
            }

            .action-btn {
                padding: 4px 12px 5px;
                font-size: 1rem;
            }

            .item-tree {
                width: 36px;
                right: 6px;
                bottom: 6px;
            }

            .receipt-viewer {
                padding: 12px;
            }

            .receipt-viewer img {
                max-width: 92vw;
                max-height: 68vh;
            }

            .edit-panel {
                padding: 14px 12px;
            }

            .form-group input,
            .form-group textarea {
                font-size: 16px;
            }
        }

        @media screen and (max-width: 400px) {
            .contribution-item {
                padding: 12px 46px 12px 10px;
            }

            .action-btn {
                padding: 3px 10px 4px;
                font-size: 0.95rem;
            }

            .item-tree {
                width: 32px;
            }
        }
    </style>
</head>

<body>
    <div class="background-container">
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="emoji-float">🎄</div>
        <div class="emoji-float">❄️</div>
        <div class="emoji-float">🎅</div>
        <div class="emoji-float">🎁</div>
        <div class="emoji-float">⭐</div>
        <div class="emoji-float">🔔</div>
        <div class="rotating-emoji" style="left: 20%; animation-delay: 0s;">⛄</div>
        <div class="rotating-emoji" style="left: 60%; animation-delay: 3s;">🦌</div>
        <div class="rotating-emoji" style="left: 80%; animation-delay: 6s;">🎀</div>
        <div class="star" style="top: 15%; left: 25%; animation-delay: 0s;">⭐</div>
        <div class="star" style="top: 30%; left: 70%; animation-delay: 1s;">✨</div>
        <div class="star" style="top: 50%; left: 15%; animation-delay: 2s;">⭐</div>
        <div class="star" style="top: 70%; left: 85%; animation-delay: 0.5s;">✨</div>
        <div class="bubble" style="width: 30px; height: 30px; left: 25%; animation-delay: 0s;"></div>
        <div class="bubble" style="width: 40px; height: 40px; left: 55%; animation-delay: 2s;"></div>
        <div class="bubble" style="width: 25px; height: 25px; left: 75%; animation-delay: 4s;"></div>
        <div class="bubble" style="width: 35px; height: 35px; left: 40%; animation-delay: 6s;"></div>
        <div class="sparkle" style="top: 20%; left: 10%; animation-delay: 0s;"></div>
        <div class="sparkle" style="top: 40%; left: 50%; animation-delay: 2s;"></div>
        <div class="sparkle" style="top: 60%; left: 30%; animation-delay: 4s;"></div>
        <div class="sparkle" style="top: 80%; left: 70%; animation-delay: 1s;"></div>
        <div class="floating-shapes" style="width: 60px; height: 60px; background: rgba(255, 255, 255, 0.2); border-radius: 50%; top: 10%; left: 5%;"></div>
        <div class="floating-shapes" style="width: 40px; height: 40px; background: rgba(255, 255, 255, 0.15); border-radius: 20%; top: 60%; left: 90%; animation-delay: 2s;"></div>
    </div>
    <div class="page">
        <div class="top-bar">
            <a class="back-btn" href="index.html" onclick="return goBack(event)">← Back</a>
        </div>

        <h1>Contribution List</h1>
        <p class="subtitle">Christmas Gathering — who’s bringing what</p>

        <div class="edit-panel" id="editPanel">
            <h3>Edit Contribution</h3>
            <form id="editForm" onsubmit="saveEdit(event)">
                <div class="form-group">
                    <label for="editName">Your Name:</label>
                    <input type="text" id="editName" required>
                </div>
                <div class="form-group">
                    <label for="editItems">Items:</label>
                    <textarea id="editItems" rows="3" required></textarea>
                </div>
                <button type="submit" class="submit-btn" id="saveEditBtn">Update ✨</button>
                <button type="button" class="submit-btn cancel-btn" onclick="cancelEdit()">Cancel</button>
            </form>
        </div>

        <div class="list-panel">
            <div id="contributionsContainer">
                <p class="empty">Loading...</p>
            </div>
        </div>
    </div>

    <div class="receipt-viewer" id="receiptViewer" onclick="closeReceipt(event)">
        <p id="receiptTitle">Receipt</p>
        <img id="receiptImg" alt="Receipt">
        <button class="action-btn" onclick="closeReceipt()">Close</button>
    </div>

    <script>
        function goBack(event) {
            if (window.history.length > 1) {
                event.preventDefault();
                history.back();
                return false;
            }
            return true;
        }

        const firebaseConfig = {
            apiKey: "AIzaSyAsMqAziqwXuTSqX16Cl09j7ZqNxnn1L_4",
            authDomain: "beach-e0f41.firebaseapp.com",
            projectId: "beach-e0f41",
            storageBucket: "beach-e0f41.firebasestorage.app",
            messagingSenderId: "491840385634",
            appId: "1:491840385634:web:601d11fa61a2bb3cf4173b",
            measurementId: "G-S6X60G886D"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const COLLECTION_NAME = "contributions";

        let contributions = [];
        let editingDocId = null;

        function loadContributions() {
            db.collection(COLLECTION_NAME)
                .orderBy("timestamp", "desc")
                .onSnapshot((snapshot) => {
                    contributions = [];
                    snapshot.forEach((doc) => {
                        contributions.push({
                            id: doc.id,
                            name: doc.data().name,
                            items: doc.data().items,
                            receipt: doc.data().receipt || ""
                        });
                    });
                    updateContributionsList();
                }, (error) => {
                    console.error(error);
                    document.getElementById("contributionsContainer").innerHTML =
                        "<p class='empty'>Could not load contributions.</p>";
                });
        }

        function updateContributionsList() {
            const container = document.getElementById("contributionsContainer");
            container.innerHTML = "";

            if (contributions.length === 0) {
                container.innerHTML = "<p class='empty'>No contributions yet. Be the first to add one! 🎉</p>";
                return;
            }

            contributions.forEach((contribution, index) => {
                const item = document.createElement("div");
                item.className = "contribution-item";
                item.innerHTML = `
                    <img src="tree.png" alt="" class="item-tree" aria-hidden="true">
                    <strong>#${index + 1} ${contribution.name}</strong>
                    <span>${contribution.items}</span>
                    <div class="contribution-actions">
                        <button class="action-btn delete-btn" onclick="deleteContribution('${contribution.id}')">Delete</button>
                        <button class="action-btn edit-btn" onclick="startEdit('${contribution.id}')">Edit</button>
                        ${contribution.receipt
                            ? `<button class="action-btn receipt-btn" onclick="showReceipt('${contribution.id}')">Receipt</button>`
                            : `<span class="no-receipt">No receipt</span>`}
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function showReceipt(docId) {
            const contribution = contributions.find(c => c.id === docId);
            if (!contribution || !contribution.receipt) return;
            document.getElementById("receiptTitle").textContent = "Receipt — " + contribution.name;
            document.getElementById("receiptImg").src = contribution.receipt;
            document.getElementById("receiptViewer").classList.add("open");
        }

        function closeReceipt(event) {
            if (event && event.target.id !== "receiptViewer") return;
            document.getElementById("receiptViewer").classList.remove("open");
            document.getElementById("receiptImg").src = "";
        }

        function startEdit(docId) {
            const contribution = contributions.find(c => c.id === docId);
            if (!contribution) return;
            editingDocId = docId;
            document.getElementById("editName").value = contribution.name;
            document.getElementById("editItems").value = contribution.items;
            document.getElementById("editPanel").style.display = "block";
            document.getElementById("editPanel").scrollIntoView({ behavior: "smooth", block: "start" });
        }

        function cancelEdit() {
            editingDocId = null;
            document.getElementById("editForm").reset();
            document.getElementById("editPanel").style.display = "none";
        }

        async function saveEdit(event) {
            event.preventDefault();
            if (!editingDocId) return;

            const name = document.getElementById("editName").value.trim();
            const items = document.getElementById("editItems").value.trim();
            const btn = document.getElementById("saveEditBtn");
            btn.disabled = true;
            btn.textContent = "Saving...";

            try {
                await db.collection(COLLECTION_NAME).doc(editingDocId).update({ name, items });
                cancelEdit();
            } catch (error) {
                console.error(error);
                alert("Error updating contribution. Please try again.");
            } finally {
                btn.disabled = false;
                btn.textContent = "Update ✨";
            }
        }

        async function deleteContribution(docId) {
            if (!confirm("Are you sure you want to delete this contribution?")) return;
            try {
                await db.collection(COLLECTION_NAME).doc(docId).delete();
                if (editingDocId === docId) cancelEdit();
            } catch (error) {
                console.error(error);
                alert("Error deleting contribution. Please try again.");
            }
        }

        window.addEventListener("DOMContentLoaded", loadContributions);

        // On a phone, a bright sweep follows the finger while the list scrolls.
        let fingerY = window.innerHeight / 2;
        let touched = false;
        let shineTimer;

        function placeShine() {
            document.querySelectorAll(".contribution-item").forEach((card) => {
                const rect = card.getBoundingClientRect();
                const center = rect.top + rect.height / 2;
                const delta = (center - fingerY) / Math.max(rect.height, 80);
                card.style.setProperty("--shine", (50 + delta * 90) + "%");
            });
        }

        function beginShine(y) {
            if (window.innerWidth > 700) return;
            touched = true;
            fingerY = y;
            document.body.classList.add("is-scrolling");
            placeShine();
            clearTimeout(shineTimer);
        }

        function endShine() {
            clearTimeout(shineTimer);
            shineTimer = setTimeout(() => {
                document.body.classList.remove("is-scrolling");
            }, 320);
        }

        window.addEventListener("touchstart", (event) => {
            beginShine(event.touches[0].clientY);
        }, { passive: true });

        window.addEventListener("touchmove", (event) => {
            beginShine(event.touches[0].clientY);
        }, { passive: true });

        window.addEventListener("scroll", () => {
            if (!touched || window.innerWidth > 700) return;
            document.body.classList.add("is-scrolling");
            placeShine();
            endShine();
        }, { passive: true });

        window.addEventListener("touchend", endShine, { passive: true });
        window.addEventListener("touchcancel", endShine, { passive: true });
    </script>
</body>

</html>
