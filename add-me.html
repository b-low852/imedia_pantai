<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Add Me — What will you bring?</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                linear-gradient(180deg, rgba(0, 0, 0, 0.35) 0%, rgba(20, 0, 0, 0.25) 100%),
                url('xmas.gif') center center / cover no-repeat;
            background-color: #1a0a0a;
            background-attachment: fixed;
            color: #fff;
            padding: 24px 16px 40px;
        }

        .page {
            max-width: 560px;
            margin: 0 auto;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 14px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.45);
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.25);
            margin-bottom: 18px;
        }

        .back-btn:hover {
            background: rgba(0, 0, 0, 0.65);
        }

        .qr-frame {
            position: relative;
            margin-top: 8px;
            width: 100%;
            height: 640px;
            background: url('lamp.gif') center center / 100% 100% no-repeat;
            text-align: center;
        }

        .qr-inner {
            position: absolute;
            top: 12%;
            left: 14%;
            right: 14%;
            bottom: 22%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .qr-frame h3 {
            margin: 0;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 1);
        }

        .qr-frame img {
            max-width: 200px;
            width: 78%;
            height: auto;
            border-radius: 8px;
        }

        .qr-steps {
            max-width: 260px;
            margin: 0;
            color: #fff;
            font-size: 0.95rem;
            line-height: 1.4;
            font-weight: bold;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 1);
        }

        .qr-steps p {
            margin: 0 0 6px;
        }

        .qr-steps ol {
            margin: 0 auto;
            padding-left: 1.25em;
            text-align: left;
            display: inline-block;
        }

        .qr-steps li {
            margin-bottom: 4px;
        }

        .contribution-frame {
            margin-top: 8px;
            min-height: 460px;
            padding: 36px 28px 64px;
            background: url('lamp.gif') center center / 100% 100% no-repeat;
        }

        .contribution-panel {
            padding: 36px 4px 8px;
            background: transparent;
            border: none;
        }

        .contribution-panel h3 {
            margin: 0 0 14px;
            color: #fff;
            text-align: center;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 1);
        }

        .form-group {
            max-width: 260px;
            margin: 0 auto 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 1);
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 8px 10px;
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 8px;
            font-size: 14px;
            font-family: Arial, sans-serif;
            background: #fff;
            color: #0d3b66;
        }

        .form-group textarea {
            min-height: 56px;
            resize: vertical;
        }

        .submit-btn {
            max-width: 140px;
            margin: 0 auto;
            display: block;
            padding: 4px 18px 6px;
            border-radius: 999px;
            border: 1px solid #fff;
            box-shadow: 0 2px 8px rgba(120, 0, 0, 0.3);
            background: linear-gradient(180deg, #ff6b6b 0%, #e63946 45%, #c1121f 100%);
            color: #fff;
            cursor: pointer;
        }

        .submit-btn .btn-text {
            font-family: "Great Vibes", cursive;
            font-size: 1.25rem;
            color: #fff;
            -webkit-text-fill-color: #fff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
        }

        .list-link-btn {
            display: block;
            margin: 14px auto 0;
            max-width: 320px;
            text-align: center;
            padding: 8px 12px;
            color: #ffe8a3;
            text-decoration: underline;
            font-family: Arial, sans-serif;
            font-size: 0.95rem;
            font-weight: bold;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        }

        .list-link-btn:hover {
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="page">
        <a class="back-btn" href="index.html">← Back</a>

        <div class="qr-frame">
            <div class="qr-inner">
                <h3>📱 Scan QR Code</h3>
                <img src="qrr.png" alt="QR Code">
                <div class="qr-steps">
                    <p>Please follow these steps:</p>
                    <ol>
                        <li>Key in your info below</li>
                        <li>Scan to pay</li>
                        <li>Upload your receipt</li>
                    </ol>
                </div>
            </div>
        </div>

        <div class="contribution-frame">
            <div class="contribution-panel">
                <h3>What will you bring? 🎒</h3>
                <form id="contributionForm" onsubmit="saveContribution(event)">
                    <div class="form-group">
                        <label for="name">Your Name:</label>
                        <input type="text" id="name" name="name" required placeholder="Enter your name">
                    </div>
                    <div class="form-group">
                        <label for="items">Items you're bringing:</label>
                        <textarea id="items" name="items" required placeholder="e.g., Drinks, Snacks, Chips, etc."></textarea>
                    </div>
                    <button type="submit" class="submit-btn" id="submitBtn"><span class="btn-text">Submit</span></button>
                </form>
            </div>
        </div>

        <a class="list-link-btn" href="contributions.html">Click to see contribution list</a>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAsMqAziqwXuTSqX16Cl09j7ZqNxnn1L_4",
            authDomain: "beach-e0f41.firebaseapp.com",
            projectId: "beach-e0f41",
            storageBucket: "beach-e0f41.firebasestorage.app",
            messagingSenderId: "491840385634",
            appId: "1:491840385634:web:601d11fa61a2bb3cf4173b",
            measurementId: "G-S6X60G886D"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const COLLECTION_NAME = "contributions";

        async function saveContribution(event) {
            event.preventDefault();
            const name = document.getElementById("name").value.trim();
            const items = document.getElementById("items").value.trim();
            const submitBtn = document.getElementById("submitBtn");

            if (!name || !items) return;

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="btn-text">Saving...</span>';

            try {
                await db.collection(COLLECTION_NAME).add({
                    name: name,
                    items: items,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                window.location.href = "contributions.html";
            } catch (error) {
                console.error(error);
                alert("Error saving contribution. Please try again.");
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span class="btn-text">Submit</span>';
            }
        }
    </script>
</body>

</html>
