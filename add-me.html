    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Mountains of Christmas", cursive;
            background-color: #1a0a0a;
            color: #fff;
            padding: 24px 16px 40px;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background: url('xmas.gif') center center / cover no-repeat;
            background-color: #0b1a2e;
        }

        .page {
            position: relative;
            z-index: 1;
            max-width: 560px;
            margin: 0 auto;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 14px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.45);
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.25);
            margin-bottom: 18px;
        }

        .back-btn:hover {
            background: rgba(0, 0, 0, 0.65);
        }

        .qr-frame {
            position: relative;
            overflow: hidden;
            margin-top: 8px;
            width: 100%;
            height: auto;
            box-sizing: border-box;
            padding: 18px 16px 20px;
            background: transparent;
            border: 1px solid rgba(255, 215, 120, 0.45);
            border-radius: 18px;
            box-shadow: 0 0 0 rgba(255, 214, 90, 0);
            text-align: center;
            animation: qrPulse 2.8s ease-in-out infinite;
            transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
        }

        .qr-frame::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(110deg, transparent 32%, rgba(255, 255, 255, 0.28) 48%, transparent 64%);
            background-size: 220% 100%;
            animation: qrShine 4.2s ease-in-out infinite;
            pointer-events: none;
        }

        .qr-frame:hover {
            transform: translateY(-4px) scale(1.01);
            border-color: rgba(255, 230, 150, 0.9);
            box-shadow: 0 0 22px rgba(255, 214, 90, 0.45);
        }

        .qr-frame:active {
            transform: translateY(-1px) scale(1);
        }

        @keyframes qrPulse {
            0%, 100% { border-color: rgba(255, 215, 120, 0.35); }
            50% { border-color: rgba(255, 236, 170, 0.85); }
        }

        @keyframes qrShine {
            0%, 100% { background-position: 120% 0; }
            50% { background-position: -20% 0; }
        }

        .qr-inner {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 6px;

        .qr-frame h3,
        .qr-steps,
        .contribution-panel h3,
        .form-group label,

            font-family: "Mountains of Christmas", cursive;

            margin: 0;
            font-size: 1.7rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 1);

        .qr-code {

            height: auto;

        .qr-steps {
            max-width: 260px;
            margin: 0;

            line-height: 1.3;
            font-weight: 700;

        .qr-steps p {
            margin: 0 0 6px;
        }

        .qr-steps ol {

            display: inline-block;

        .qr-steps li {
            margin-bottom: 4px;

        .section-divider {
            width: 82%;

            margin: 14px auto 4px;

            background: linear-gradient(90deg, transparent, rgba(255, 215, 120, 0.85), transparent);

        .contribution-panel {
            width: 100%;
            margin-top: 8px;
            padding: 4px 0 0;
            background: transparent;

        }

        .contribution-panel h3 {
            margin: 0 0 14px;
            font-size: 1.55rem;
            font-weight: 700;
            color: #fff;
            text-align: center;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 1);
        }

        .form-group {
            max-width: 210px;
            margin: 0 auto 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 1.25rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 1);
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 8px 10px;
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 8px;
            font-size: 14px;
            font-family: "Mountains of Christmas", cursive;
            background: #fff;
            color: #0d3b66;
        }

        .form-group textarea {
            min-height: 44px;
            resize: vertical;
        }

        .receipt-upload {
            display: block;
            width: 100%;
            padding: 10px;
            border: 2px dashed rgba(255, 255, 255, 0.6);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.35);
            text-align: center;
            cursor: pointer;
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
        }

        .receipt-upload.has-file {
            border-color: #6bff8f;
        }

        .receipt-upload input {
            display: none;
        }

        .receipt-preview {
            display: none;
            max-width: 100%;
            max-height: 110px;
            margin: 8px auto 0;
            border-radius: 6px;
        }

        .submit-btn {
            max-width: 140px;
            margin: 0 auto;
            display: block;
            padding: 4px 18px 6px;
            border-radius: 999px;
            border: 1px solid #fff;
            box-shadow: 0 2px 8px rgba(120, 0, 0, 0.3);
            background: linear-gradient(180deg, #ff6b6b 0%, #e63946 45%, #c1121f 100%);
            color: #fff;
            cursor: pointer;
        }

        .submit-btn .btn-text {
            font-family: "Mountains of Christmas", cursive;
            font-size: 1.25rem;
            color: #fff;
            -webkit-text-fill-color: #fff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
        }

        .list-link-btn {
            display: block;
            margin: 14px auto 0;
            max-width: 320px;
            text-align: center;
            padding: 8px 12px;
            color: #ffe8a3;
            text-decoration: underline;
            font-family: "Mountains of Christmas", cursive;
            font-size: 1.25rem;
            font-weight: bold;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        }

        .list-link-btn:hover {
            color: #fff;
        }

        @media screen and (max-width: 700px) {
            body {
                overflow-x: hidden;
                padding: 16px 10px 28px;
            }

            .page {
                max-width: 100%;
            }

            .qr-frame {
                height: auto;
                padding: 16px 12px 18px;
            }

            .qr-inner {
                gap: 6px;
            }

            .qr-frame h3 {
                font-size: 1.4rem;
            }

            .qr-code {
                max-width: 130px;
                width: 58%;
            }

            .qr-steps {
                max-width: 220px;
                font-size: 1.05rem;
                line-height: 1.25;
            }

            .contribution-panel h3 {
                font-size: 1.35rem;
                margin-bottom: 10px;
            }

            .form-group {
                max-width: 210px;
            }

            .form-group label {
                font-size: 1.15rem;
            }

            .form-group input,
            .form-group textarea {
                font-size: 16px;
            }

            .receipt-preview {
                max-height: 90px;
            }
        }

        @media screen and (max-width: 400px) {
            .qr-frame {
                padding: 14px 10px 16px;
            }

            .qr-code {
                max-width: 110px;
            }
        }
    </style>

<body>

        <div class="particle"></div>
        <div class="particle"></div>

        <div class="emoji-float">❄️</div>
        <div class="emoji-float">🎅</div>

    <div class="page">
        <a class="back-btn" href="index.html" onclick="return goBack(event)">← Back</a>

        <div class="qr-frame">
            <div class="qr-inner">
                <h3>📱 Scan QR Code</h3>
                <img class="qr-code" src="qrr.png" alt="QR Code">
                <div class="qr-steps">
                    <p>Please follow these steps:</p>
                    <ol>
                        <li>Key in your info below</li>
                        <li>Scan to pay</li>
                        <li>Upload your receipt</li>
                    </ol>
                </div>
                <hr class="section-divider">
                <div class="contribution-panel">
                    <h3>What will you bring? 🎒</h3>
                    <form id="contributionForm" onsubmit="saveContribution(event)">
                        <div class="form-group">
                            <label for="name">Your Name:</label>
                            <input type="text" id="name" name="name" required placeholder="Enter your name">
                        </div>
                        <div class="form-group">
                            <label for="items">Items you're bringing:</label>
                            <textarea id="items" name="items" required placeholder="e.g., Drinks, Snacks, Chips, etc."></textarea>
                        </div>
                        <div class="form-group">
                            <label for="receipt">Upload receipt:</label>
                            <label class="receipt-upload" id="receiptLabel">
                                <span id="receiptText">📎 Tap to choose receipt image</span>
                                <input type="file" id="receipt" accept="image/*" onchange="previewReceipt(event)">
                            </label>
                            <img id="receiptPreview" class="receipt-preview" alt="Receipt preview">
                        </div>
                        <button type="submit" class="submit-btn" id="submitBtn"><span class="btn-text">Submit</span></button>
                    </form>
                </div>
            </div>
        </div>

        <a class="list-link-btn" href="contributions.html">Click to see contribution list</a>

    <script>
        function goBack(event) {
            if (window.history.length > 1) {
                event.preventDefault();
                history.back();
                return false;
            }
            return true;
        }

        const firebaseConfig = {
            apiKey: "AIzaSyAsMqAziqwXuTSqX16Cl09j7ZqNxnn1L_4",
            authDomain: "beach-e0f41.firebaseapp.com",
            projectId: "beach-e0f41",
            storageBucket: "beach-e0f41.firebasestorage.app",
            messagingSenderId: "491840385634",
            appId: "1:491840385634:web:601d11fa61a2bb3cf4173b",
            measurementId: "G-S6X60G886D"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const COLLECTION_NAME = "contributions";

        // Firestore documents are capped at 1 MB, so the receipt is shrunk until it fits.
        const MAX_RECEIPT_CHARS = 700000;

        function previewReceipt(event) {
            const file = event.target.files[0];
            const preview = document.getElementById("receiptPreview");
            const label = document.getElementById("receiptLabel");
            const text = document.getElementById("receiptText");

            if (!file) {
                preview.style.display = "none";
                label.classList.remove("has-file");
                text.textContent = "📎 Tap to choose receipt image";
                return;
            }

            text.textContent = "✅ " + file.name;
            label.classList.add("has-file");
            preview.src = URL.createObjectURL(file);
            preview.style.display = "block";
        }

        function loadImage(file) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => reject(new Error("Could not read that image. Please choose a JPG or PNG."));
                img.src = URL.createObjectURL(file);
            });
        }

        async function compressReceipt(file) {
            const img = await loadImage(file);
            let maxSide = 1000;
            let quality = 0.7;

            while (true) {
                const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
                const canvas = document.createElement("canvas");
                canvas.width = Math.round(img.width * scale);
                canvas.height = Math.round(img.height * scale);
                canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
                const dataUrl = canvas.toDataURL("image/jpeg", quality);

                if (dataUrl.length <= MAX_RECEIPT_CHARS) return dataUrl;
                if (maxSide <= 400) throw new Error("Receipt image is too large. Please choose a smaller image.");

                maxSide -= 150;
                quality = Math.max(0.4, quality - 0.1);
            }
        }

        async function saveContribution(event) {
            event.preventDefault();
            const name = document.getElementById("name").value.trim();
            const items = document.getElementById("items").value.trim();
            const file = document.getElementById("receipt").files[0];
            const submitBtn = document.getElementById("submitBtn");

            if (!name || !items) return;
            if (!file) {
                alert("Please upload your payment receipt.");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="btn-text">Uploading...</span>';

            try {
                const receipt = await compressReceipt(file);
                const docRef = await db.collection(COLLECTION_NAME).add({
                    name: name,
                    items: items,
                    receipt: receipt,
                    paid: true,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                const saved = await docRef.get({ source: "server" });
                if (!saved.exists || !saved.data().receipt) {
                    throw new Error("Receipt was not saved. Please try again.");
                }

                window.location.href = "contributions.html";
            } catch (error) {
                console.error(error);
                alert(error.message || "Error saving contribution. Please try again.");
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span class="btn-text">Submit</span>';
            }
        }
    </script>

</body>
